<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Document Drop Shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>

    <!-- Page Surface Gradient -->
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- PDF Red Brand Gradient -->
    <linearGradient id="pdf-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Placed Field Active Fill Gradient -->
    <linearGradient id="field-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.08" />
    </linearGradient>

    <!-- Fold Corner Shadow -->
    <linearGradient id="fold-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Document Body with Shadow -->
  <g filter="url(#drop-shadow)">
    <!-- Main Sheet Path (with folded top-right corner) -->
    <path d="M 112 48 
             L 336 48 
             L 416 128 
             L 416 448 
             A 16 16 0 0 1 400 464 
             L 112 464 
             A 16 16 0 0 1 96 448 
             L 96 64 
             A 16 16 0 0 1 112 48 Z" 
          fill="url(#page-grad)" />

    <!-- Folded Corner Flap -->
    <path d="M 336 48 
             L 336 112 
             A 16 16 0 0 0 352 128 
             L 416 128 Z" 
          fill="url(#fold-shadow)" 
          opacity="0.7" />
  </g>

  <!-- PDF Badge (Top Left Tab) -->
  <path d="M 128 48 L 192 48 L 192 108 L 160 92 L 128 108 Z" fill="url(#pdf-red)" />
  <text x="160" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="0.5">PDF</text>

  <!-- Dummy Content Lines (Background Document Content) -->
  <g stroke="#E2E8F0" stroke-width="8" stroke-linecap="round">
    <line x1="216" y1="88" x2="300" y2="88" />
    <line x1="144" y1="160" x2="368" y2="160" stroke="#CBD5E1" />
    <line x1="144" y1="192" x2="320" y2="192" />
    <line x1="144" y1="360" x2="368" y2="360" />
    <line x1="144" y1="392" x2="260" y2="392" />
  </g>

  <!-- Placed Form Field Container (Active Drop Target) -->
  <g transform="translate(136, 224)">
    <!-- Field Outer Active Box -->
    <rect x="0" y="0" width="240" height="96" rx="8" 
          fill="url(#field-fill)" 
          stroke="#3B82F6" 
          stroke-width="2.5" 
          stroke-dasharray="6 4" />

    <!-- Field Inner Label Text / Placeholder -->
    <rect x="16" y="20" width="120" height="12" rx="4" fill="#60A5FA" opacity="0.6" />
    <rect x="16" y="44" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" />
    <text x="28" y="65" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Enter value...</text>

    <!-- Corner Resize Handles (Field Placer UI Indicators) -->
    <circle cx="0" cy="0" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="240" cy="0" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="0" cy="96" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="240" cy="96" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Placement Pointer Cursor -->
  <g transform="translate(320, 290)">
    <!-- Cursor Shadow -->
    <path d="M 0 0 L 16 48 L 26 34 L 46 42 L 52 28 L 32 22 L 44 10 Z" 
          fill="#0F172A" opacity="0.2" transform="translate(2, 4)" />
    <!-- Pointer Vector -->
    <path d="M 0 0 L 16 48 L 25 33 L 45 41 L 51 27 L 31 21 L 43 9 Z" 
          fill="#0F172A" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
  </g>
</svg>
